# Deployed as a Worker serving static assets, not as a Pages project.
#
# The distinction is what broke the first build: Workers Builds runs
# `npx wrangler deploy`, which wants either a script entry-point or an assets
# directory. `pages_build_output_dir` is a Pages-only key, so wrangler ignored
# it and failed with "Missing entry-point to Worker script or to assets
# directory" — after the Astro build had already succeeded.
#
# There is now a `main`, where before there deliberately was not. The site is still
# prebuilt files and they are still served straight from [assets]; the script exists for
# one POST route — the Digital Estate Roles feedback form, which files a GitHub issue on
# the reader's behalf so that nobody needs a GitHub account to report a gap. Every other
# request is handed to env.ASSETS untouched.

name = "xebecstudios"
main = "worker/index.js"
compatibility_date = "2026-01-01"

[vars]
# Where reader feedback is filed. The token that authorises it is a secret, not a var:
#   wrangler secret put GITHUB_TOKEN       (fine-grained PAT, Issues: write, this repo only)
#   wrangler secret put TURNSTILE_SECRET   (secret key of the Turnstile widget)
FEEDBACK_REPO = "derrumbe/digital-estate-roles"

[assets]
directory = "./dist"
# Bound so the Worker can fall through to the built files for everything but the one route.
binding = "ASSETS"
# Pages served /404.html for unmatched paths by convention. Workers does
# not: the 404 page is built either way, but without this it is never
# reached and visitors get the default response instead.
not_found_handling = "404-page"
